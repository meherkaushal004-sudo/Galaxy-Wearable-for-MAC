name: Release

# Ein Tag wie "v0.1.0" pushen → DMG wird gebaut und als GitHub-Release veröffentlicht.
# Ohne Apple-Secrets entsteht eine unsignierte DMG (Gatekeeper-Warnung beim ersten Öffnen).
# Mit Secrets wird signiert und notarisiert:
#   MACOS_CERT_P12      – Developer-ID-Zertifikat als .p12, base64-kodiert
#   MACOS_CERT_PASSWORD – Passwort der .p12
#   MACOS_SIGN_IDENTITY – z. B. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD – für die Notarisierung

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Zertifikat importieren
        if: ${{ github.event_name == 'push' && env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KC_PASS="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Notarisierung vorbereiten
        if: ${{ github.event_name == 'push' && env.HAS_NOTARY == 'true' }}
        env:
          HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials budsbar \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=budsbar" >> "$GITHUB_ENV"

      - name: Bauen
        env:
          UNIVERSAL: "1"
          SIGN_IDENTITY: ${{ github.event_name == 'push' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/build-dmg.sh

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --title "BudsBar $GITHUB_REF_NAME" --generate-notes
